# BOLZO RMM – nginx Reverse-Proxy
# Ablage: /etc/nginx/sites-available/bolzo-rmm  (+ Symlink nach sites-enabled)
# SSL ergänzt certbot automatisch:  certbot --nginx -d rmm.bolzo.net
#
# Anpassen: server_name (Subdomain) und die Adresse des RMM-Servers in "upstream".

# WebSocket-Upgrade nur weiterreichen, wenn der Client es anfordert.
# Eigener Variablenname, damit es nicht mit einer map aus anderen Configs (z.B. BRC) kollidiert.
map $http_upgrade $bolzo_rmm_connection_upgrade {
    default upgrade;
    ''      close;
}

# Protokoll OHNE Query-String: Download-Links und Install-Befehle tragen Schlüssel in der Adresse,
# die sollen nicht im Access-Log landen.
log_format bolzo_rmm_noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

# Anmeldeversuche bremsen (zusätzlich zur Sperre im Server): 10 pro Minute und Adresse
limit_req_zone $binary_remote_addr zone=bolzo_rmm_login:1m rate=10r/m;

upstream bolzo_rmm {
    server 10.2.30.3:8095;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rmm.bolzo.net;

    access_log /var/log/nginx/bolzo-rmm.access.log bolzo_rmm_noquery;
    server_tokens off;

    # Nur wirksam über HTTPS (nach certbot): Browser und Apps erzwingen dann immer HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API-Anfragen sind klein (Skripte bis 2 MB)
    client_max_body_size 4m;

    # Gemeinsame Proxy-Einstellungen
    proxy_http_version 1.1;
    # Der Server baut daraus die Adresse für die Install-Befehle (https://rmm.bolzo.net)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/login {
        limit_req zone=bolzo_rmm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bolzo_rmm;
    }

    location / {
        proxy_pass http://bolzo_rmm;

        # WebSockets für Agents, Live-Daten und Terminal – ohne die läuft nichts
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bolzo_rmm_connection_upgrade;
        # (proxy_set_header in einem location-Block ersetzt die obigen – deshalb hier wiederholt)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Verbindungen bleiben dauerhaft offen (Server pingt alle 30 s)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Terminal-Ausgabe und Live-Daten sofort durchreichen
        proxy_buffering off;
    }
}

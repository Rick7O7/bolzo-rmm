<!-- BOLZO RMM – Logo mit Schriftzug (für helle Hintergründe) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <svg x="0" y="0" width="400" height="400" viewBox="0 0 512 512"><defs>
    <linearGradient id="bz-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18191d"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="bz-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bz-iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.45" stop-color="#f5a524"/>
      <stop offset="0.85" stop-color="#a85a00"/>
      <stop offset="1" stop-color="#5c2e00"/>
    </radialGradient>
    <linearGradient id="bz-pupil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0d00" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0b0602"/>
      <stop offset="1" stop-color="#1a0d00" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="bz-lid" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="420">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <clipPath id="bz-eye">
      <path d="M58 262 Q256 70 454 262 Q256 454 58 262 Z"/>
    </clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bz-bg)"/>
  <circle cx="256" cy="256" r="220" fill="url(#bz-glow)"/>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="#f5a524" stroke-opacity="0.5" stroke-width="6"/>
  <path d="M92 176 Q256 34 420 176" fill="none" stroke="url(#bz-lid)" stroke-width="16" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Augapfel: Iris und Pupille liegen hinter dem Lid und werden von ihm angeschnitten -->
  <g clip-path="url(#bz-eye)">
    <path d="M58 262 Q256 70 454 262 Q256 454 58 262 Z" fill="#f5a524" fill-opacity="0.08"/>
    <circle cx="256" cy="262" r="104" fill="url(#bz-iris)"/>
    <circle cx="256" cy="262" r="104" fill="none" stroke="#3d1f00" stroke-opacity="0.6" stroke-width="8"/>
    <path d="M256 196 Q272 262 256 328 Q240 262 256 196 Z" fill="url(#bz-pupil)"/>
    <circle cx="288" cy="232" r="12" fill="#ffffff" fill-opacity="0.75"/>
    <circle cx="228" cy="296" r="5" fill="#ffffff" fill-opacity="0.3"/>
  </g>
  <path d="M58 262 Q256 70 454 262 Q256 454 58 262 Z" fill="none" stroke="url(#bz-lid)" stroke-width="26" stroke-linejoin="miter" stroke-miterlimit="10"/>
</svg>
  <text x="460" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="178" font-weight="800" letter-spacing="8" fill="#141416">BOLZO<tspan dx="34" font-weight="500" letter-spacing="6" fill="#c27a00">RMM</tspan></text>
</svg>
